syntax = "proto3";

package mfqd.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  SESSION_MODE_TEXT = 1;
  SESSION_MODE_VOICE = 2;
  SESSION_MODE_FULL_DUPLEX = 3;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_IDLE = 1;
  SESSION_STATE_LISTENING = 2;
  SESSION_STATE_PROCESSING = 3;
  SESSION_STATE_SPEAKING = 4;
  SESSION_STATE_INTERRUPTED = 5;
  SESSION_STATE_RECONNECTING = 6;
  SESSION_STATE_ERROR = 7;
  SESSION_STATE_CLOSED = 8;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_SYSTEM = 1;
  MESSAGE_ROLE_USER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
  MESSAGE_ROLE_TOOL = 4;
}

enum ScalarType {
  SCALAR_TYPE_UNSPECIFIED = 0;
  SCALAR_TYPE_U8 = 1;
  SCALAR_TYPE_I16 = 2;
  SCALAR_TYPE_I32 = 3;
  SCALAR_TYPE_F16 = 4;
  SCALAR_TYPE_BF16 = 5;
  SCALAR_TYPE_F32 = 6;
}

message RuntimeIdentity {
  string model_sha256 = 1;
  string quantization = 2;
  string runtime_build = 3;
  string tokenizer_sha256 = 4;
  string chat_template_sha256 = 5;
  string processor_version = 6;
  string rope_parameters_sha256 = 7;
  string kv_dtype = 8;
}

message SharedMemoryRef {
  string region_id = 1;
  uint64 offset = 2;
  uint64 byte_length = 3;
  ScalarType scalar_type = 4;
  repeated uint64 shape = 5;
  repeated uint64 strides = 6;
  string sha256 = 7;
}

message MediaRef {
  string id = 1;
  string sha256 = 2;
  string mime_type = 3;
  uint64 byte_size = 4;
}

message TextPart {
  string text = 1;
}

message ReasoningPart {
  string text = 1;
}

message ImagePart {
  MediaRef media = 1;
  optional uint32 width = 2;
  optional uint32 height = 3;
}

message AudioPart {
  MediaRef media = 1;
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;
  optional uint64 duration_ms = 4;
}

message TranscriptPart {
  string text = 1;
  optional string language = 2;
  optional uint64 start_ms = 3;
  optional uint64 end_ms = 4;
}

message ToolCallPart {
  string call_id = 1;
  string name = 2;
  google.protobuf.Struct arguments = 3;
}

message ToolResultPart {
  string call_id = 1;
  google.protobuf.Value result = 2;
  bool is_error = 3;
}

message GeneratedAudioPart {
  MediaRef media = 1;
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;
  optional uint64 duration_ms = 4;
}

message ContentPart {
  oneof part {
    TextPart text = 1;
    ReasoningPart reasoning = 2;
    ImagePart image = 3;
    AudioPart audio = 4;
    TranscriptPart transcript = 5;
    ToolCallPart tool_call = 6;
    ToolResultPart tool_result = 7;
    GeneratedAudioPart generated_audio = 8;
  }
}

message SamplingParams {
  uint32 max_tokens = 1;
  double temperature = 2;
  uint32 top_k = 3;
  double top_p = 4;
  double presence_penalty = 5;
  double frequency_penalty = 6;
  double repetition_penalty = 7;
  optional uint64 seed = 8;
}

message HandshakeRequest {
  string protocol_version = 1;
  string daemon_build = 2;
}

message HandshakeResponse {
  string protocol_version = 1;
  string runtime_build = 2;
  string platform = 3;
  repeated string capabilities = 4;
}

message OpenSessionRequest {
  string session_id = 1;
  string model = 2;
  SessionMode mode = 3;
  RuntimeIdentity identity = 4;
}

message AppendInputRequest {
  string session_id = 1;
  string response_id = 2;
  string request_id = 3;
  uint64 expected_revision = 4;
  repeated ContentPart input = 5;
  SamplingParams sampling = 6;
}

message ForkSessionRequest {
  string source_session_id = 1;
  string target_session_id = 2;
  optional string at_message_id = 3;
}

message CancelResponseRequest {
  string session_id = 1;
  string response_id = 2;
}

message CloseSessionRequest {
  string session_id = 1;
}

message PushAudioRequest {
  string session_id = 1;
  AudioChunk audio = 2;
}

message CommitAudioRequest {
  string session_id = 1;
  uint64 last_audio_sequence = 2;
}

message RuntimeRequest {
  string request_id = 1;
  oneof request {
    HandshakeRequest handshake = 2;
    OpenSessionRequest open_session = 3;
    AppendInputRequest append_input = 4;
    ForkSessionRequest fork_session = 5;
    CancelResponseRequest cancel_response = 6;
    CloseSessionRequest close_session = 7;
    PushAudioRequest push_audio = 8;
    CommitAudioRequest commit_audio = 9;
  }
}

message SessionSnapshot {
  string session_id = 1;
  SessionState state = 2;
  uint64 revision = 3;
  uint64 qwen_tokens = 4;
  uint64 whisper_frames = 5;
  uint64 tts_tokens = 6;
}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  google.protobuf.Struct details = 4;
}

message RuntimeResponse {
  string request_id = 1;
  oneof response {
    HandshakeResponse handshake = 2;
    SessionSnapshot session = 3;
    Error error = 4;
  }
}

message ResponseTextDelta {
  string delta = 1;
}

message ResponseReasoningDelta {
  string delta = 1;
}

message ResponseToolCallDelta {
  uint32 index = 1;
  optional string call_id = 2;
  optional string name = 3;
  string arguments_delta = 4;
}

message TokenUsage {
  uint64 prompt_tokens = 1;
  uint64 completion_tokens = 2;
  uint64 total_tokens = 3;
}

message ResponseCompleted {
  string finish_reason = 1;
  optional TokenUsage usage = 2;
}

message AudioChunk {
  uint64 audio_sequence = 1;
  uint64 timestamp_ms = 2;
  uint32 sample_rate_hz = 3;
  uint32 channels = 4;
  oneof payload {
    bytes pcm_s16le = 5;
    SharedMemoryRef shared_memory = 6;
  }
}

message ResponseInterrupted {
  string reason = 1;
}

message SessionStateChanged {
  SessionState state = 1;
  uint64 revision = 2;
}

message RuntimeMetrics {
  string instance_id = 1;
  uint64 queue_depth = 2;
  uint64 resident_bytes = 3;
  uint64 kv_bytes = 4;
  optional double prefill_tokens_per_second = 5;
  optional double decode_tokens_per_second = 6;
}

message RuntimeEvent {
  string session_id = 1;
  string response_id = 2;
  uint64 sequence = 3;
  google.protobuf.Timestamp timestamp = 4;
  oneof event {
    ResponseTextDelta text_delta = 5;
    AudioChunk audio_delta = 6;
    ResponseInterrupted interrupted = 7;
    SessionStateChanged session_state = 8;
    RuntimeMetrics metrics = 9;
    Error error = 10;
    ResponseReasoningDelta reasoning_delta = 11;
    ResponseToolCallDelta tool_call_delta = 12;
    ResponseCompleted completed = 13;
  }
}

message RuntimeEnvelope {
  oneof frame {
    RuntimeRequest request = 1;
    RuntimeResponse response = 2;
    RuntimeEvent event = 3;
  }
}
