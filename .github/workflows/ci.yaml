name: Native build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-core:
    name: Linux storage and expert cache
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Configure portable runtime tests
        run: >-
          cmake -S cpp_runtime -B build/linux-core -DCMAKE_BUILD_TYPE=Release
          -DMFQ_BUILD_CUDA_RUNTIME=OFF -DMFQ_BUILD_HIP_RUNTIME=OFF
          -DMFQ_BUILD_METAL_RUNTIME=OFF -DMFQ_BUILD_RUNTIME_COMMUNICATION=ON
          -DBUILD_TESTING=ON
      - name: Build storage and cache regression tests
        run: >-
          cmake --build build/linux-core --parallel 2 --target
          mfq-file-range-reader-test mfq-model-source-test mfq-quant-expert-range-test
          mfq-moe-cache-policy-test mfq-moe-cache-profile-test mfq-native-tensor-test
          mfq-moe-host-memory-test mfq-model-config-test
          mfq-nemotron-vision-config-test mfq-nemotron-vision-geometry-test
          mfq-deepseek-v41-vision-layout-test
          mfq-prefill-budget-test
          mfq-benchmark-validation-test mfq-tokenizer-identity-test
          mfq-text-processor-test mfq-request-executor-test mfq-runtime-transport-test
          mfq-kv-admission-test mfq-speculative-sequence-test
      - name: Run Linux regression tests
        run: >-
          ctest --test-dir build/linux-core --output-on-failure
          -R '^mfq-(file-range-reader|model-source|quant-expert-range|moe-cache-policy|moe-cache-profile|native-tensor|moe-host-memory|model-config|nemotron-vision-config|nemotron-vision-geometry|deepseek-v41-vision-layout|prefill-budget|benchmark-validation|tokenizer-identity|text-processor|request-executor|runtime-transport|kv-admission|speculative-sequence)-test$'

  benchmark-regressions:
    name: Benchmark regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Sync benchmark test dependencies
        run: uv sync --extra benchmark --extra dev --python 3.11
      - name: Check benchmark validation and evaluation contracts
        run: >-
          uv run --with-requirements bench/requirements-reporting.txt python -m pytest -q
          tests/test_model_bench.py tests/test_inference_benchmark.py
          tests/test_benchmark_report.py tests/test_report_workflow.py
          tests/test_mmlu_prompt_sizing.py tests/test_accuracy_benchmark.py
          tests/test_probability_scoring.py tests/test_official_evaluation_datasets.py
          tests/test_server_evaluations.py tests/test_scoring_sandbox.py
          tests/test_tokenizer_identity.py tests/test_wt2_reference.py
          tests/test_native_wt2_reference.py tests/test_wikitext_quality_jobs.py

      - name: Check serving concurrency and metrics
        run: >-
          uv run python -m pytest -q
          tests/test_server_concurrency.py tests/test_server_protocol.py
          tests/test_server_prometheus_metrics.py tests/test_serving_statistics.py

      - name: Check automatic residency and sharded load metadata
        run: >-
          uv run python -m pytest -q
          tests/test_cuda_automatic_residency.py tests/test_model_memory.py
          tests/test_formats/test_shards.py tests/test_engram_companions.py

  macos-metal:
    name: macOS Metal
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync dependencies
        run: uv sync --extra metal

      - name: Build
        run: uv run mfq build

      - name: Build quality and benchmark paths
        run: >-
          cmake --build build/cpp_runtime --target mfq-perplexity
          mfq-metal-dense-smallm-benchmark mfq-metal-engine-test
      - name: Check Metal runtime controls
        run: ctest --test-dir build/cpp_runtime --output-on-failure -R '^mfq-metal-engine-test$'
      - name: Check evaluator tokenizer contracts
        env:
          MFQ_METAL_PERPLEXITY_TEST: build/cpp_runtime/metal/mfq-perplexity
        run: uv run --with pytest python -m pytest tests/test_tokenizer_identity_cli.py -q

      - name: Check text prefill chunking
        run: |
          cmake --build build/cpp_runtime --target mfq-metal-qwen35-causal-lm-test mfq-metal-minicpmo45-test mfq-metal-nemotron-test
          ctest --test-dir build/cpp_runtime --output-on-failure -R '^mfq-metal-(qwen35-causal-lm|minicpmo45|nemotron-conv)-test$'
      - name: Check Nemotron text, MTP and RADIO vision
        env:
          MFQ_METAL_NEMOTRON_TEST: build/cpp_runtime/metal/mfq-metal-nemotron-test
        run: uv run --with pytest python -m pytest tests/test_metal_nemotron_runtime.py -q
