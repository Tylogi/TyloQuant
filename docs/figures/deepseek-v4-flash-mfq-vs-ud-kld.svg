<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V4-Flash-0731 MFQ versus Unsloth Dynamic Mean KLD</title>
  <desc id="desc">Two panels compare full WikiText-2 Mean KLD against disk size at context lengths 512 and 2048. Three MFQ tiers have lower KLD than all plotted Unsloth Dynamic tiers. Lower is better.</desc>
  <defs>
    <style>
      .title { font: 700 27px Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 13.5px Inter, "Segoe UI", Arial, sans-serif; fill: #687386; }
      .panel-title { font: 700 16px Inter, "Segoe UI", Arial, sans-serif; fill: #273449; }
      .axis { font: 13px Inter, "Segoe UI", Arial, sans-serif; fill: #536074; }
      .tick { font: 12px Inter, "Segoe UI", Arial, sans-serif; fill: #687386; }
      .label { font: 600 11.5px Inter, "Segoe UI", Arial, sans-serif; }
      .legend { font: 600 12px Inter, "Segoe UI", Arial, sans-serif; fill: #38465a; }
      .note { font: 600 13px Inter, "Segoe UI", Arial, sans-serif; fill: #435169; }
      .grid { stroke: #dce2ea; stroke-width: 1; }
      .frame { fill: #fbfcfe; stroke: #dce2ea; stroke-width: 1; }
      .pair { stroke: #9eaabd; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .ud-line { fill: none; stroke: #e07a2e; stroke-width: 2.2; opacity: .84; }
      .mfq-line { fill: none; stroke: #2477d4; stroke-width: 2.8; opacity: .94; }
      .ud-point { fill: #fff; stroke: #e07a2e; stroke-width: 2.5; }
      .ud-duplicate { fill: #fff7ef; stroke: #e07a2e; stroke-width: 2.5; }
      .mfq-point { fill: #2477d4; stroke: #fff; stroke-width: 1.5; }
      .ud-text { fill: #ad5518; }
      .mfq-text { fill: #155ca9; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#fff"/>
  <text class="title" x="75" y="42">DeepSeek-V4-Flash-0731: MFQ vs. Unsloth Dynamic</text>
  <text class="subtitle" x="75" y="67">Full WikiText-2 evaluation · identical BF16 reference · lower Mean KLD is better</text>

