[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfq"
dynamic = ["version"]
description = "Mixed Format Quantization: tensorwise mixed-precision quantization for CUDA (NVIDIA) and Metal (Apple Silicon)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MFQ contributors" }]
keywords = ["quantization", "llm", "cuda", "metal", "mlx", "int4", "nint", "mixed-precision"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gguf>=0.19.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
daemon = [
    "av>=12.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "pypdf>=5.0.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]
train = [
    "scipy>=1.10.0",
    "safetensors>=0.4.0",
    "torch>=2.1.0",
]
calibration = [
    "huggingface_hub>=0.25.0",
    "pyarrow>=14.0.0",
    "safetensors>=0.4.0",
    "scipy>=1.10.0",
    "torch>=2.4.0",
    "transformers>=5.7.0",
]
minicpmo45 = [
    "accelerate>=0.26.0",
    "librosa>=0.10.0",
    "minicpmo-utils[all]>=1.0.5",
    "safetensors>=0.4.3",
    "soundfile>=0.12.1",
    "torch>=2.3.0,<=2.8.0",
    "torchaudio>=2.3.0,<=2.8.0",
    "transformers==4.51.0",
]
tpq = [
    "fastapi>=0.115.0",
    "ninja>=1.11.0",
    "psutil>=5.9.0",
    "safetensors>=0.4.0",
    "tiktoken>=0.7.0",
    "tokenizers>=0.19.0",
    "torch>=2.4.0",
    "uvicorn>=0.30.0",
]
metal = [
    "mlx>=0.32.0",
]
minicpmo45-realtime = [
    "fastapi>=0.115.0",
    "hyperpyyaml>=1.2.2",
    "httpx>=0.27.0",
    "onnxruntime>=1.20.0",
    "s3tokenizer>=0.3.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.1",
    "stepaudio2-minicpmo>=0.1.1",
    "torch>=2.3.0",
    "torchaudio>=2.3.0",
    "transformers>=4.51.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.scripts]
mfq = "mfq.cli:main"
mfq-minicpmo-realtime = "mfq.runtime.minicpmo45_realtime:main"

[dependency-groups]
release = [
    "pyinstaller==6.21.0",
]

[project.urls]
Repository = "https://github.com/Tylogi/TyloQuant"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]

[tool.setuptools.dynamic]
version = { attr = "mfq._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["mfq*"]

[tool.setuptools.package-data]
"mfq.server" = [
    "protocol/*.json",
    "protocol/*.proto",
]
"mfq._vendor.tpq" = [
    "README.md",
    "chat_adapters/README.md",
    "configs/README.md",
    "configs/*.json",
    "csrc/README.md",
    "csrc/*.cpp",
    "csrc/*.cu",
    "csrc/*.cuh",
]

[tool.uv]
override-dependencies = ["librosa>=0.10.0"]
conflicts = [
    [
        { extra = "calibration" },
        { extra = "minicpmo45" },
    ],
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
